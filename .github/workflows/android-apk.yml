name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - pubspec.yaml

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip apk]') }}
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://school-clocking-system.onrender.com/api/v1' }}
      APP_DOWNLOAD_BASE_URL: ${{ vars.APP_DOWNLOAD_BASE_URL || 'https://tkclocking.online' }}
      APP_ANDROID_UPDATE_REQUIRED: ${{ vars.APP_ANDROID_UPDATE_REQUIRED || 'false' }}
      APP_ANDROID_RELEASE_NOTES: ${{ vars.APP_ANDROID_RELEASE_NOTES || 'A new version of TK Clocking System is ready. Update now to get the latest fixes and improvements.' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Flutter version bump
        id: version_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; APK build will continue."
            exit 0
          fi

          CURRENT_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          CURRENT_CODE="${CURRENT_VERSION##*+}"
          PREVIOUS_VERSION="$(git show "$BEFORE_SHA:pubspec.yaml" 2>/dev/null | grep '^version:' | awk '{print $2}' || true)"
          PREVIOUS_CODE="${PREVIOUS_VERSION##*+}"

          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid current Flutter version: $CURRENT_VERSION"
            exit 1
          fi

          if ! [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]]; then
            echo "No previous Flutter version found; APK build will continue."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_CODE" -gt "$PREVIOUS_CODE" ]; then
            echo "Flutter build number increased: $PREVIOUS_VERSION -> $CURRENT_VERSION"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Flutter build number did not increase: $PREVIOUS_VERSION -> $CURRENT_VERSION"
            echo "Skipping APK build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.version_gate.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.version_gate.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        if: steps.version_gate.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; building with the local debug signing fallback."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=${{ github.workspace }}/android/app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure Firebase Android
        if: steps.version_gate.outputs.should_build == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is required to build the Android app."
            echo "Create it from android/app/google-services.json and add it as a GitHub Actions secret."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Install Flutter dependencies
        if: steps.version_gate.outputs.should_build == 'true'
        run: flutter pub get

      - name: Analyze Flutter code
        if: steps.version_gate.outputs.should_build == 'true'
        run: flutter analyze --no-pub

      - name: Build release APK
        if: steps.version_gate.outputs.should_build == 'true'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_DOWNLOAD_BASE_URL="$APP_DOWNLOAD_BASE_URL"
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_DOWNLOAD_BASE_URL="$APP_DOWNLOAD_BASE_URL"

      - name: Publish APK and update manifests
        if: steps.version_gate.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p dashboard/public/apps
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dashboard/public/apps/school-clocking-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dashboard/public/apps/school-clocking-arm32.apk
          cp build/app/outputs/flutter-apk/app-release.apk dashboard/public/apps/school-clocking-universal.apk
          cp build/app/outputs/flutter-apk/app-release.apk dashboard/public/apps/tk_clocking.apk

          APP_ANDROID_UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
          node scripts/sync-mobile-app-version.mjs

      - name: Commit generated APK
        if: steps.version_gate.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          CHANGES="$(git status --porcelain -- dashboard/public/apps/school-clocking-arm64.apk dashboard/public/apps/school-clocking-arm32.apk dashboard/public/apps/school-clocking-universal.apk dashboard/public/apps/tk_clocking.apk dashboard/public/apps/app-version.json backend/src/modules/mobile-app/mobile-app.manifest.ts)"
          if [ -z "$CHANGES" ]; then
            echo "No APK or manifest changes to commit."
            exit 0
          fi

          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/apps/school-clocking-arm64.apk dashboard/public/apps/school-clocking-arm32.apk dashboard/public/apps/school-clocking-universal.apk dashboard/public/apps/tk_clocking.apk dashboard/public/apps/app-version.json backend/src/modules/mobile-app/mobile-app.manifest.ts
          git commit -m "chore: publish Android APK v$VERSION_LINE [skip apk]"
          git push
